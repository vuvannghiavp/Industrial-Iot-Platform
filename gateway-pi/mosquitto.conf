# Local durable broker. Create the password file and ACL before starting.
persistence true
persistence_location /mosquitto/data/
autosave_interval 5
max_queued_messages 10000
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
listener 1883 127.0.0.1

# Replace the endpoint, local password, and install the AWS certificates before
# starting Mosquitto. Store this file with permissions that protect its password.
connection aws_iot_core
address a3kopdrc302etb-ats.iot.ap-southeast-1.amazonaws.com:8883
remote_clientid pi-gateway-01
local_username aws_bridge
local_password REPLACE_WITH_A_LONG_RANDOM_BRIDGE_PASSWORD
bridge_protocol_version mqttv311
bridge_cafile /etc/mosquitto/certs/AmazonRootCA1.pem
bridge_certfile /etc/mosquitto/certs/certificate.pem.crt
bridge_keyfile /etc/mosquitto/certs/private.pem.key
cleansession false
start_type automatic
restart_timeout 5 60
try_private false
notifications false
topic smarthome/home-01/pi-gateway-01/telemetry out 1
topic smarthome/home-01/pi-gateway-01/alerts out 1
topic smarthome/home-01/pi-gateway-01/command in 1
